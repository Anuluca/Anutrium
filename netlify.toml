[build]
  command = "yarn install --ignore-engines && yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.12.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

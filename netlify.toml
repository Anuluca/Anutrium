[build]
  command = "yarn install --ignore-engines && yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.12.0"
  VITE_GA4_MEASUREMENT_ID = "G-FEZS2B4N4L"

[[redirects]]
  from = "/api/analytics/*"
  to = "https://steam-api.anuluca.com/analytics/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/floratrium/media"
  to = "https://steam-api.anuluca.com/floratrium/media"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

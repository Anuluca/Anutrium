<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人海湾 · 五种页面视觉方案</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #171416; }
      body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .sheet { position: relative; width: 1440px; min-height: 1800px; overflow: hidden; margin: 0 auto 48px; }
      .sheet * { position: relative; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; }
      .topbar { height: 104px; display: flex; align-items: center; justify-content: space-between; padding: 0 76px; border-bottom: 1px solid currentColor; }
      .wordmark { font-size: 18px; font-weight: 800; letter-spacing: .08em; }
      .wordmark span { display: block; margin-top: 4px; font-size: 8px; letter-spacing: .44em; font-weight: 600; }
      .topbar nav { display: flex; gap: 38px; font-size: 11px; letter-spacing: .16em; font-weight: 700; }
      .topbar nav b { color: var(--accent); }
      .meta-line { display: flex; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: .18em; }
      .meta-line span:first-child { color: var(--accent); }
      .lead { font-size: 15px; line-height: 2; font-weight: 400; }
      .module-no { font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--accent); }
      .module-en { font-size: 10px; letter-spacing: .22em; opacity: .5; }
      .subitems { display: flex; flex-wrap: wrap; gap: 8px; }
      .subitem { display: inline-flex; justify-content: space-between; align-items: center; gap: 17px; font-size: 13px; letter-spacing: .06em; white-space: nowrap; }
      .subitem em { font-size: 13px; font-style: normal; opacity: .5; }
      .footer-line { position: absolute !important; left: 76px; right: 76px; bottom: 42px; display: flex; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid currentColor; font-size: 10px; letter-spacing: .18em; opacity: .55; }
      .photo { display: block; width: 100%; height: 100%; object-fit: cover; }

      /* 01 — 投影长廊：入口的单一大画面，栏目沿纵向展开。 */
      .s1 { --accent: #e85d72; background: #0b090c; color: #f3efeb; }
      .s1::before { content: ""; position: absolute; width: 980px; height: 770px; top: -50px; right: -180px; background: radial-gradient(ellipse at 42% 42%, rgba(222,68,91,.12), transparent 62%); }
      .s1 .topbar { border-color: #2e262b; }
      .s1 .hero { height: 600px; padding: 78px 76px 0; display: grid; grid-template-columns: 1fr 510px; column-gap: 80px; }
      .s1 .hero h1 { font-size: 106px; margin: 45px 0 22px; letter-spacing: -.06em; line-height: 1.05; font-weight: 500; }
      .s1 .hero h1 i { display: block; font-style: normal; color: var(--accent); }
      .s1 .hero .lead { width: 360px; color: #a9a1a4; }
      .s1 .hero .screen { height: 405px; margin-top: 20px; padding: 12px; border: 1px solid #69565d; background: #1b151a; }
      .s1 .hero .screen::after { content: "01 / 04  ·  IMAGE ARCHIVE"; position: absolute; left: 12px; bottom: -36px; color: #a29a9d; font-size: 10px; letter-spacing: .19em; }
      .s1 .hero .screen img { filter: saturate(.65) brightness(.81); object-position: center 43%; }
      .s1 .beam { position: absolute; width: 680px; height: 610px; top: 126px; right: 280px; background: linear-gradient(110deg, transparent, rgba(240,224,207,.045) 46%, transparent); clip-path: polygon(0 0, 100% 55%, 0 100%); pointer-events: none; }
      .s1 .modules { margin: 34px 76px 0; border-top: 1px solid #3c3036; }
      .s1 .module { min-height: 231px; padding: 42px 0; display: grid; grid-template-columns: 108px 380px 1fr; align-items: start; border-bottom: 1px solid #3c3036; }
      .s1 .module h2 { margin: -7px 0 9px; font-size: 40px; font-weight: 500; letter-spacing: -.025em; }
      .s1 .subitems { gap: 18px; padding-top: 8px; }
      .s1 .subitem { min-width: 145px; padding-bottom: 13px; border-bottom: 1px solid #4b3c43; }
      .s1 .module:nth-child(4) .subitem { min-width: 310px; }

      /* 02 — 屏幕频道：四个独立频道，视觉重心是实体屏幕。 */
      .s2 { --accent: #fa735f; background: #141416; color: #e9e6df; }
      .s2 .topbar { border-color: #39383a; }
      .s2 .intro { margin: 77px 76px 0; display: flex; justify-content: space-between; align-items: end; }
      .s2 .intro h1 { font-size: 81px; font-weight: 400; letter-spacing: -.06em; margin: 15px 0 0; }
      .s2 .intro .lead { width: 310px; color: #9b9999; margin: 0 0 9px; }
      .s2 .channel-grid { margin: 69px 76px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
      .s2 .channel { height: 620px; padding: 24px; background: #202023; border: 1px solid #3f3f42; }
      .s2 .channel::after { content: ""; position: absolute; top: 21px; right: 23px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      .s2 .channel-top { display: flex; justify-content: space-between; padding-bottom: 22px; color: #aaa7a7; }
      .s2 .channel-window { height: 315px; overflow: hidden; background: #111114; border: 10px solid #0d0d10; outline: 1px solid #545155; }
      .s2 .channel-window img { filter: saturate(.6) brightness(.8); }
      .s2 .channel-window .window-word { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 104px; font-weight: 200; letter-spacing: .1em; color: #dad5d0; }
      .s2 .channel:nth-child(2) .channel-window { background: #302625; }
      .s2 .channel:nth-child(3) .channel-window { background: #262b2c; }
      .s2 .channel:nth-child(4) .channel-window { background: #232027; }
      .s2 .channel-info { margin: 24px 0 0; display: flex; align-items: baseline; justify-content: space-between; }
      .s2 .channel-info h2 { font-size: 36px; font-weight: 400; margin: 0; }
      .s2 .channel-info .module-en { color: #a8a4a4; }
      .s2 .subitems { margin-top: 21px; gap: 8px; }
      .s2 .subitem { padding: 10px 13px; border: 1px solid #535052; background: #262427; font-size: 12px; }
      .s2 .footer-line { bottom: 31px; }

      /* 03 — 编辑档案：暖白纸面与大尺度排版，保留红色品牌线索。 */
      .s3 { --accent: #c94758; background: #ebe7df; color: #2c2729; }
      .s3 .topbar { border-color: #bdb7b1; }
      .s3 .hero { height: 575px; margin: 0 76px; display: grid; grid-template-columns: 1fr 440px; gap: 100px; align-items: center; border-bottom: 1px solid #bdb7b1; }
      .s3 .hero h1 { font-family: Georgia, "Songti SC", serif; font-size: 92px; font-weight: 400; line-height: 1.16; letter-spacing: -.065em; margin: 35px 0 30px; }
      .s3 .hero h1 span { color: var(--accent); }
      .s3 .hero .lead { max-width: 490px; color: #686260; }
      .s3 .hero-visual { height: 400px; display: grid; grid-template-columns: 1fr 110px; gap: 18px; }
      .s3 .hero-visual img { filter: saturate(.55); object-position: 50% 45%; }
      .s3 .hero-visual .vertical { writing-mode: vertical-rl; display: flex; justify-content: space-between; color: #8a807f; font-size: 10px; letter-spacing: .26em; border-right: 1px solid #aca49f; padding-right: 14px; }
      .s3 .archive { margin: 0 76px; }
      .s3 .archive-row { height: 258px; display: grid; grid-template-columns: 106px 465px 1fr 66px; align-items: center; border-bottom: 1px solid #bdb7b1; }
      .s3 .archive-row h2 { font-family: Georgia, "Songti SC", serif; font-size: 56px; font-weight: 400; margin: 0; }
      .s3 .archive-row .subitems { column-gap: 35px; row-gap: 23px; }
      .s3 .archive-row .subitem { min-width: 155px; padding-bottom: 12px; border-bottom: 1px solid #c9c4bf; }
      .s3 .archive-row .arrow { justify-self: end; font-size: 30px; font-weight: 200; color: var(--accent); }

      /* 04 — 放映清单：一张主屏幕加四条远距离清单，适合渐进浏览。 */
      .s4 { --accent: #ee5b68; background: #08090b; color: #f0ede8; }
      .s4::before { content: ""; position: absolute; inset: 0; opacity: .32; background-image: linear-gradient(#ffffff0a 1px, transparent 1px); background-size: 100% 7px; pointer-events: none; }
      .s4 .topbar { border-color: #363638; }
      .s4 .stage { margin: 64px 76px 0; display: grid; grid-template-columns: 1fr 570px; gap: 75px; align-items: end; }
      .s4 .stage h1 { font-size: 96px; font-weight: 400; letter-spacing: -.065em; line-height: 1.08; margin: 34px 0 29px; }
      .s4 .stage .lead { color: #99969a; max-width: 410px; }
      .s4 .main-screen { height: 432px; padding: 16px; border: 1px solid #48454a; background: #17171a; }
      .s4 .main-screen::before { content: ""; position: absolute; inset: 5px; border: 1px solid #6d6168; pointer-events: none; z-index: 2; }
      .s4 .main-screen img { filter: grayscale(.18) brightness(.7); object-position: center 40%; }
      .s4 .main-screen b { position: absolute; bottom: 33px; left: 37px; font-weight: 400; font-size: 13px; letter-spacing: .16em; }
      .s4 .screen-caption { grid-column: 2; font-size: 10px; letter-spacing: .2em; color: #8d898a; margin-top: -51px; align-self: end; }
      .s4 .playlist { margin: 96px 76px 0; }
      .s4 .playlist-row { height: 210px; display: grid; grid-template-columns: 100px 360px 1fr 50px; align-items: center; border-top: 1px solid #474145; }
      .s4 .playlist-row:last-child { border-bottom: 1px solid #474145; }
      .s4 .playlist-row h2 { font-size: 52px; letter-spacing: -.035em; font-weight: 400; margin: 0 0 4px; }
      .s4 .playlist-row .subitems { gap: 10px; }
      .s4 .playlist-row .subitem { padding: 12px 17px; background: #171519; border: 1px solid #453c42; }
      .s4 .playlist-row .play { justify-self: end; font-size: 21px; color: var(--accent); }
      .s4 .stage { height: 560px; display: block; padding: 70px 60px; border: 1px solid #48454a; }
      .s4 .stage > div:first-child { z-index: 3; width: 620px; }
      .s4 .stage h1 { margin-top: 33px; }
      .s4 .stage .lead { color: #ded8d5; }
      .s4 .main-screen { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; }
      .s4 .main-screen::before { display: none; }
      .s4 .main-screen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #09090cf2 0%, #0a0a0ad9 40%, #08080821 100%); }
      .s4 .main-screen img { object-position: center 40%; filter: brightness(.64) saturate(.66); }
      .s4 .main-screen b { z-index: 3; bottom: 25px; left: auto; right: 25px; }
      .s4 .screen-caption { position: absolute; z-index: 3; top: 25px; right: 25px; margin: 0; }
      .s4 .playlist { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 90px; }
      .s4 .playlist-row { height: 475px; display: block; padding: 28px 27px; border-right: 1px solid #474145; }
      .s4 .playlist-row:first-child { border-left: 1px solid #474145; }
      .s4 .playlist-row h2 { margin: 46px 0 12px; font-size: 42px; }
      .s4 .playlist-row .subitems { display: flex; flex-direction: column; align-items: stretch; gap: 0; margin-top: 53px; }
      .s4 .playlist-row .subitem { width: 100%; padding: 14px 0; background: transparent; border: 0; border-bottom: 1px solid #474145; }
      .s4 .playlist-row .play { position: absolute; right: 25px; bottom: 25px; }

      /* 05 — 光箱地图：明亮底色、轻边框与四个独立坐标。 */
      .s5 { --accent: #d44a59; background: #f5f1ea; color: #241e22; }
      .s5 .topbar { border-color: #cfc8c4; }
      .s5 .hero { height: 420px; padding: 78px 76px 0; display: grid; grid-template-columns: 1fr 380px; align-items: start; }
      .s5 .hero h1 { margin: 29px 0 0; font-size: 100px; letter-spacing: -.075em; font-weight: 300; }
      .s5 .hero .lead { margin-top: 80px; color: #6f6868; }
      .s5 .map { margin: 0 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
      .s5 .map-card { height: 550px; border: 1px solid #c9c0bc; background: #eee9e3; padding: 28px; }
      .s5 .map-card::before, .s5 .map-card::after { content: ""; position: absolute; width: 17px; height: 17px; border-color: var(--accent); border-style: solid; pointer-events: none; }
      .s5 .map-card::before { left: -1px; top: -1px; border-width: 2px 0 0 2px; }
      .s5 .map-card::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; }
      .s5 .map-card .card-label { display: flex; justify-content: space-between; color: #8c8180; }
      .s5 .map-card .card-body { display: grid; grid-template-columns: 1fr 207px; gap: 20px; align-items: center; margin-top: 33px; height: 290px; }
      .s5 .map-card h2 { font-size: 58px; font-weight: 400; margin: 0 0 13px; letter-spacing: -.05em; }
      .s5 .map-card .visual { height: 280px; overflow: hidden; border: 8px solid #d9d2cc; background: #252024; }
      .s5 .map-card .visual img { filter: saturate(.47); object-position: center 35%; }
      .s5 .map-card .visual .glyph { position: absolute; inset: 0; display: grid; place-items: center; color: #e8e2da; font-family: Georgia, serif; font-size: 100px; }
      .s5 .map-card .subitems { border-top: 1px solid #c9c0bc; padding-top: 22px; gap: 13px; }
      .s5 .map-card .subitem { min-width: 145px; color: #51484a; }
      .s5 .footer-line { bottom: 31px; }
    </style>
  </head>
  <body>
    <main id="artboards"></main>
    <script>
      const modules = [
        { no: '01', title: '影像', en: 'IMAGE', items: ['摄影作品', '周边摄影', '图像记录'], image: 'assets/photo-works.jpg', glyph: '◉' },
        { no: '02', title: '创作', en: 'CREATE', items: ['绘画', '实验室', '手作'], glyph: '✳' },
        { no: '03', title: '札记', en: 'NOTES', items: ['学习笔记', '文章杂谈'], glyph: '≋' },
        { no: '04', title: '游戏档案', en: 'GAME ARCHIVE', items: ['游戏库'], glyph: '◇' },
      ]
      const nav = '<nav><span>HOME</span><span>ARCHIVE</span><span>FLÂNERIE</span><b>ISLAND</b><span>CRAFT</span><span>ABOUT</span></nav>'
      const topbarHtml = `<header class="topbar"><div class="wordmark">安屿宇宙<span>ANUTRIUM</span></div>${nav}</header>`
      const footer = '<footer class="footer-line"><span>ANULUCA · PERSONAL HARBOR</span><span>IMAGE / CREATE / NOTES / GAME ARCHIVE</span><span>2026 ©</span></footer>'
      const items = (m) => `<div class="subitems">${m.items.map(x => `<span class="subitem">${x}<em>↗</em></span>`).join('')}</div>`
      const mEn = (m) => `<span class="module-en">${m.en}</span>`
      const pages = [
        `<section class="sheet s1" aria-label="方案一：投影长廊">${topbarHtml}<div class="beam"></div><div class="hero"><div><span class="eyebrow" style="color:var(--accent)">PERSONAL HARBOR / 01</span><h1>个人<i>海湾。</i></h1><p class="lead">将见过的、做过的、想过的，<br>收藏在自己的小小港口。</p></div><div class="screen"><img class="photo" src="assets/photo-works.jpg"></div></div><div class="modules">${modules.map(m => `<div class="module"><span class="module-no">${m.no} / 04</span><div><h2>${m.title}</h2>${mEn(m)}</div>${items(m)}</div>`).join('')}</div>${footer}</section>`,
        `<section class="sheet s2" aria-label="方案二：屏幕频道">${topbarHtml}<div class="intro"><div><span class="eyebrow" style="color:var(--accent)">SIGNAL FROM THE HARBOR</span><h1>四个频道，一处海湾。</h1></div><p class="lead">选择一个频道，慢慢浏览。<br>影像、创作、札记与游戏，都有自己的位置。</p></div><div class="channel-grid">${modules.map(m => `<article class="channel"><div class="channel-top"><span class="eyebrow">CH. ${m.no} / ${m.en}</span><span class="eyebrow">● ON AIR</span></div><div class="channel-window">${m.image ? `<img class="photo" src="${m.image}">` : `<span class="window-word">${m.glyph}</span>`}</div><div class="channel-info"><h2>${m.title}</h2>${mEn(m)}</div>${items(m)}</article>`).join('')}</div>${footer}</section>`,
        `<section class="sheet s3" aria-label="方案三：编辑档案">${topbarHtml}<div class="hero"><div><span class="eyebrow" style="color:var(--accent)">VOL. 01 — THE PERSONAL INDEX</span><h1>私人的<br><span>收藏目录。</span></h1><p class="lead">作品、记录与兴趣，在同一张索引中缓慢展开。<br>每一个入口，都留出足够的呼吸空间。</p></div><div class="hero-visual"><img class="photo" src="assets/photo-works.jpg"><div class="vertical"><span>ANULUCA / 个人海湾</span><span>IMAGE — CREATE — NOTES — GAME</span></div></div></div><div class="archive">${modules.map(m => `<div class="archive-row"><span class="module-no">${m.no} / 04</span><div><h2>${m.title}</h2>${mEn(m)}</div>${items(m)}<span class="arrow">↗</span></div>`).join('')}</div>${footer}</section>`,
        `<section class="sheet s4" aria-label="方案四：放映清单">${topbarHtml}<div class="stage"><div><span class="eyebrow" style="color:var(--accent)">NOW SHOWING / PERSONAL HARBOR</span><h1>一座<br>私人的放映室。</h1><p class="lead">从一幅画面进入，再沿着清单走向不同的记录。</p></div><div class="main-screen"><img class="photo" src="assets/merch.jpg"><b>影像记录 · SELECTED FRAME</b></div><div class="screen-caption">FRAME 001 / PERSONAL COLLECTION</div></div><div class="playlist">${modules.map(m => `<div class="playlist-row"><span class="module-no">${m.no} / 04</span><div><h2>${m.title}</h2>${mEn(m)}</div>${items(m)}<span class="play">↗</span></div>`).join('')}</div>${footer}</section>`,
        `<section class="sheet s5" aria-label="方案五：光箱地图">${topbarHtml}<div class="hero"><div><span class="eyebrow" style="color:var(--accent)">A QUIET PLACE FOR EVERYTHING</span><h1>个人海湾<span style="color:var(--accent)">.</span></h1></div><p class="lead">四块独立的光箱，给每一类收藏自己的空间。<br>简单、清楚、可以继续生长。</p></div><div class="map">${modules.map(m => `<article class="map-card"><div class="card-label"><span class="eyebrow">PORT ${m.no}</span><span class="eyebrow">${m.en}</span></div><div class="card-body"><div><h2>${m.title}</h2><span class="module-en">${m.items.length} ENTRIES</span></div><div class="visual">${m.image ? `<img class="photo" src="${m.image}">` : `<span class="glyph">${m.glyph}</span>`}</div></div>${items(m)}</article>`).join('')}</div>${footer}</section>`
      ]
      document.getElementById('artboards').innerHTML = pages.join('')
    </script>
  </body>
</html>
